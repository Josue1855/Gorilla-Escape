name: Unity 6000.3.23f1 test and Windows player
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unity-tests:
    name: Unity EditMode and PlayMode (licensed)
    if: vars.UNITY_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Confirm pinned editor
        shell: bash
        run: grep -Fx 'm_EditorVersion: 6000.3.23f1' Unity/ProjectSettings/ProjectVersion.txt
      - name: Run EditMode and PlayMode tests
        id: testRunner
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Unity
          unityVersion: 6000.3.23f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve Unity test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unity-test-results
          path: ${{ steps.testRunner.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 30
  unity-build:
    name: Build Windows desktop Player (Mono)
    needs: unity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Unity
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneWindows64
          buildName: GorillaEscape
      - name: Package Player
        shell: bash
        run: |
          test -d build
          tar -czf GorillaEscape-Windows64-UnityPlayer.tar.gz build
          sha256sum GorillaEscape-Windows64-UnityPlayer.tar.gz > GorillaEscape-Windows64-UnityPlayer.sha256
      - name: Publish Windows64 Player artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GorillaEscape-Windows64-UnityPlayer
          path: |
            GorillaEscape-Windows64-UnityPlayer.tar.gz
            GorillaEscape-Windows64-UnityPlayer.sha256
          retention-days: 30
