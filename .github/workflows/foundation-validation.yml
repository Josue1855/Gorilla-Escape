name: Foundation validation
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  java-react-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PWA/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm --prefix PWA ci
      - run: npm --prefix PWA test
      - run: npm --prefix PWA run build
      # Existing native WebRTC factory needs an audio service even for DataChannel-only tests.
      # Provision only the disposable CI runner; do not alter product RTC or skip the real test.
      - name: Prepare audio service for native WebRTC integration
        run: |
          if ! command -v pulseaudio >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pulseaudio
          fi
          pulseaudio --start --exit-idle-time=-1
      - run: Server/mvnw -B -f Server/pom.xml verify
      - run: python3 tools/validate_foundation.py
