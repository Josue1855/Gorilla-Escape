name: Issue title triage
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
jobs:
  apply-existing-label:
    runs-on: ubuntu-latest
    steps:
      - name: Infer issue type only from explicit title prefix
        id: classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          payload = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          issue = payload["issue"]
          match = re.match(r"^\\[(bug|task|feature|docs)\\]", issue["title"].strip(), re.I)
          mapping = {"bug": "type:bug", "task": "type:task", "feature": "type:feature", "docs": "type:documentation"}
          label = mapping[match.group(1).lower()] if match else ""
          labels = {x["name"] for x in issue.get("labels", [])}
          if label in labels:
              label = ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"label={label}\\n")
          PY
      - name: Add classification label without changing owner or closing issue
        if: steps.classify.outputs.label != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.classify.outputs.label }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NO" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL"
