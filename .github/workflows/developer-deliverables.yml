name: Gorilla Escape development deliverables
on:
  pull_request:
    paths:
      - '.github/workflows/developer-deliverables.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build-development-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PWA/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile developer snapshot (full Maven tests run in Foundation validation)
        run: |
          npm --prefix PWA ci
          npm --prefix PWA test
          npm --prefix PWA run build
          Server/mvnw -B -f Server/pom.xml -DskipTests package
      - name: Package developer snapshot and build manifest
        shell: bash
        run: |
          mkdir -p out
          printf 'Gorilla Escape development snapshot\nCommit: %s\nRef: %s\nUnity sources are provided but the Unity Player is NOT built or tested by this workflow.\nJava 21 required to execute the JAR.\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > out/BUILD_INFO.txt
          cp Server/target/local-server-*.jar out/
          (tar -czf gorilla-escape-dev-snapshot.tar.gz Unity Shared docs -C out .)
          sha256sum gorilla-escape-dev-snapshot.tar.gz > gorilla-escape-dev-snapshot.sha256
      - name: Upload development deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gorilla-escape-development
          path: |
            gorilla-escape-dev-snapshot.tar.gz
            gorilla-escape-dev-snapshot.sha256
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-development-snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gorilla-escape-development
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gorilla-escape-dev-snapshot.tar.gz gorilla-escape-dev-snapshot.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Development $GITHUB_REF_NAME" --prerelease
