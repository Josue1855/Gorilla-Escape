version: 2
updates:
  - package-ecosystem: npm
    directory: /PWA
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directory: /Server
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
