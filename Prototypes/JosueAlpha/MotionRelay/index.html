<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MotionLink</title>
<style>body{margin:0;background:#070b14;color:white;font:18px system-ui;display:grid;place-items:center;min-height:100vh}.c{width:min(88%,430px)}h1{font-size:48px;color:#73f4df;margin-bottom:10px}input,button{box-sizing:border-box;width:100%;height:64px;margin:8px 0;border-radius:14px;text-align:center;font-size:25px}button{background:#73f4df;border:0;font-weight:bold}p{color:#aeb8cc;line-height:1.5}.ok{color:#73f4df}</style>
<main class=c><h1>MotionLink</h1><p>Sostén el celular vertical como un control de Wii y apunta moviendo la muñeca.</p><input id=room maxlength=4 placeholder=ABCD><button id=activate>Activar control</button><button id=confirmButton style="display:none;background:#ffd83d;height:82px">CONFIRMAR / LANZAR</button><button id=recenterButton style="display:none;background:#fff">RECENTRAR PUNTERO</button><p id=status>Esperando</p></main>
<script>
const roomInput=document.getElementById('room'),activateButton=document.getElementById('activate'),confirmButton=document.getElementById('confirmButton'),recenterButton=document.getElementById('recenterButton'),statusText=document.getElementById('status');
let latest=null,running=false,count=0,last=performance.now(),confirmCount=0,recenterCount=0;
let motion={ax:0,ay:0,az:0,rx:0,ry:0,rz:0};
addEventListener('devicemotion',e=>{let a=e.acceleration||e.accelerationIncludingGravity,rot=e.rotationRate;motion={ax:a?.x||0,ay:a?.y||0,az:a?.z||0,rx:rot?.alpha||0,ry:rot?.beta||0,rz:rot?.gamma||0}});
addEventListener('deviceorientation',e=>{if(e.alpha!=null)latest={type:'motion',time:Date.now(),alpha:e.alpha,beta:e.beta,gamma:e.gamma,screen:screen.orientation?.angle||0,confirm:confirmCount,recenter:recenterCount,...motion}});
async function send(){if(!running)return;if(latest){try{await fetch('/motion?room='+roomInput.value.toUpperCase(),{method:'POST',body:JSON.stringify(latest),cache:'no-store'});count++;let now=performance.now();if(now-last>1000){statusText.className='ok';statusText.textContent='Control activo · '+count+' envíos/s';count=0;last=now}}catch{statusText.textContent='Reconectando…'}}setTimeout(send,0)}
activateButton.onclick=async()=>{let code=roomInput.value.toUpperCase();if(!/^[A-Z0-9]{4}$/.test(code)){statusText.textContent='Escribe el código de 4 caracteres';return}if(DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!=='granted'){statusText.textContent='Permiso rechazado';return}running=true;activateButton.disabled=true;confirmButton.style.display='block';recenterButton.style.display='block';statusText.textContent='Activando sensores…';send()};
confirmButton.onclick=()=>{confirmCount++;if(latest)latest.confirm=confirmCount;navigator.vibrate?.(50)};
recenterButton.onclick=()=>{recenterCount++;if(latest)latest.recenter=recenterCount;navigator.vibrate?.([30,30,30])};
</script>
