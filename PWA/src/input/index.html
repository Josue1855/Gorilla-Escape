<!doctype html><html><head><meta charset="utf-8"><title>Gorilla Escape — Phase 0 mobile runtime lab</title></head><body><h1>Mobile input runtime lab</h1><p>Control técnico — sin gameplay.</p><p id="state" role="status">PREPARE DEVICE antes de JOIN GAME. Usa el QR vigente mostrado en la PC.</p><button id="join" type="button">JOIN GAME</button><p><a href="/prepare">PREPARE DEVICE</a></p><button id="copy-diagnostic" type="button">Copiar diagnóstico</button><pre id="diagnostic" aria-label="Diagnóstico sanitizado"></pre><script type="module">import {MobileClient,normalizeMotion,bindCapture,attachCapture} from './mobileClient.js';import {SensorCapture} from './sensors/capture.js';window.MobileClient=MobileClient;window.normalizeMotion=normalizeMotion;window.bindCapture=bindCapture;window.attachCapture=attachCapture;window.SensorCapture=SensorCapture;
const button=document.querySelector('#join'),status=document.querySelector('#state');
document.querySelector('#copy-diagnostic').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.querySelector('#diagnostic').textContent);document.querySelector('#copy-diagnostic').textContent='Diagnóstico copiado';}catch{document.querySelector('#copy-diagnostic').textContent='Selecciona y copia el diagnóstico visible';}});
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='CONNECTING';
try {if(!isSecureContext)throw Error('Se requiere un origen HTTPS confiable.');
window.client=new MobileClient({source:'physical'});await client.connect(location.href);
history.replaceState(null,'',location.pathname);status.textContent='READY técnico — WebRTC OPEN. No es READY competitivo.';
}catch {status.textContent=`No se pudo conectar. Código técnico: ${window.client?.trace?.code||'JOIN_SECURE_CONTEXT_REQUIRED'}. Solicita un QR nuevo; este intento no se puede repetir.`;}
 document.querySelector('#diagnostic').textContent=JSON.stringify(window.client?.diagnostic()||{code:'JOIN_SECURE_CONTEXT_REQUIRED'},null,2);
 history.replaceState(null,'',location.pathname);});
window.addEventListener('pagehide',()=>{window.client?.close(false);});</script></body></html>
